name: "AI Recruitment Clerk CodeQL Configuration"

queries:
  - uses: security-extended
  - uses: security-and-quality

paths-ignore:
  - '**/node_modules/**'
  - '**/dist/**'
  - '**/coverage/**'
  - '**/test-results/**'
  - '**/*.spec.ts'
  - '**/*.test.ts'
  - '**/*.spec.js'
  - '**/*.test.js'
  - 'tools/**'
  - 'monitoring/**'
  - 'performance/**'
  - 'scripts/**'
  - 'e2e/**'

query-filters:
  - exclude:
      id: js/unused-local-variable
  - exclude:
      id: js/useless-assignment-to-local
  - exclude:
      id: js/superfluous-trailing-arguments
  - exclude:
      id: js/trivial-conditional
  - exclude:
      id: js/syntax-error
  - exclude:
      id: js/overwritten-property