name: 'Server Lifecycle Management'
description: 'Composite action for managing static server lifecycle: cleanup, build, start, health-check, and stop'

inputs:
  port:
    description: 'Port number for the server'
    required: false
    default: '4200'
  build-command:
    description: 'Command to build the frontend'
    required: true
  serve-command:
    description: 'Command to start the static server'
    required: true
  health-check-url:
    description: 'URL for health check'
    required: false
    default: 'http://localhost:4200'
  health-check-timeout:
    description: 'Health check timeout in milliseconds'
    required: false
    default: '60000'
  working-directory:
    description: 'Working directory for commands (optional)'
    required: false
    default: '.'
  server-log-path:
    description: 'Path for server log output'
    required: false
    default: '/tmp/server.log'
  verify-build-output:
    description: 'Verify build output directory exists (optional)'
    required: false
    default: ''

outputs:
  server-pid:
    description: 'PID of the started server'
    value: ${{ steps.start-server.outputs.server-pid }}

runs:
  using: 'composite'
  steps:
    - name: Pre-cleanup - kill processes on port ${{ inputs.port }}
      shell: bash
      run: |
        echo "🧹 Cleaning up any existing processes on port ${{ inputs.port }}..."
        if command -v lsof &> /dev/null; then
          PIDS=$(lsof -ti:${{ inputs.port }} 2>/dev/null || true)
          if [ -n "$PIDS" ]; then
            echo "Found processes on port ${{ inputs.port }}: $PIDS"
            echo "$PIDS" | xargs -r kill -9 2>/dev/null || true
            sleep 2
          fi
        elif command -v fuser &> /dev/null; then
          fuser -k ${{ inputs.port }}/tcp 2>/dev/null || true
          sleep 2
        fi
        # Verify port is free
        if curl -s http://localhost:${{ inputs.port }} > /dev/null 2>&1; then
          echo "⚠️ Warning: Port ${{ inputs.port }} is still in use after cleanup"
        else
          echo "✅ Port ${{ inputs.port }} is free"
        fi

    - name: Build frontend
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        echo "🔨 Building frontend..."
        ${{ inputs.build-command }}

    - name: Verify build output
      if: inputs.verify-build-output != ''
      shell: bash
      run: |
        if [ ! -d "${{ inputs.verify-build-output }}" ]; then
          echo "❌ Error: Build output not found at ${{ inputs.verify-build-output }}"
          exit 1
        fi
        echo "✅ Build output verified at ${{ inputs.verify-build-output }}"

    - name: Start static server
      id: start-server
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        echo "🚀 Starting static server on port ${{ inputs.port }}..."
        nohup bash -c "${{ inputs.serve-command }}" > ${{ inputs.server-log-path }} 2>&1 &
        SERVER_PID=$!
        echo "server-pid=$SERVER_PID" >> $GITHUB_OUTPUT
        echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
        echo "📋 Server PID: $SERVER_PID"
        echo "⏳ Waiting for server to initialize..."
        sleep 5

    - name: Health check - verify server is ready
      shell: bash
      run: |
        echo "🏥 Running health check..."
        if [ -f "scripts/health-check-server.mjs" ]; then
          node scripts/health-check-server.mjs ${{ inputs.health-check-url }} --timeout ${{ inputs.health-check-timeout }} --verbose
        else
          # Fallback to simple curl-based health check
          TIMEOUT=${{ inputs.health-check-timeout }}
          INTERVAL=2000
          START_TIME=$(date +%s%N | cut -b1-13)
          ATTEMPT=0
          
          while true; do
            CURRENT_TIME=$(date +%s%N | cut -b1-13)
            ELAPSED=$((CURRENT_TIME - START_TIME))
            
            if [ $ELAPSED -ge $TIMEOUT ]; then
              echo "❌ Health check timed out after ${TIMEOUT}ms"
              exit 1
            fi
            
            ATTEMPT=$((ATTEMPT + 1))
            if curl -s -f ${{ inputs.health-check-url }} > /dev/null 2>&1; then
              echo "✅ Server is healthy after $ATTEMPT attempts (${ELAPSED}ms)"
              exit 0
            fi
            
            echo "Attempt $ATTEMPT failed, retrying..."
            sleep $((INTERVAL / 1000))
          done
        fi

    - name: Output server logs on health check failure
      if: failure()
      shell: bash
      run: |
        echo "❌ Health check failed. Server logs:"
        echo "========================================"
        cat ${{ inputs.server-log-path }} || echo "No server logs available"
        echo "========================================"

    - name: Stop server (post cleanup)
      if: failure()
      shell: bash
      run: |
        SERVER_PID="${{ env.SERVER_PID }}"
        if [ -n "$SERVER_PID" ]; then
          echo "🛑 Stopping server (PID: $SERVER_PID)..."
          kill $SERVER_PID 2>/dev/null || true
          sleep 2
          # Force kill if still running
          if kill -0 $SERVER_PID 2>/dev/null; then
            echo "Force killing PID $SERVER_PID..."
            kill -9 $SERVER_PID 2>/dev/null || true
          fi
          echo "✅ Server stopped"
        fi

        # Final cleanup - kill any process on the port
        if command -v lsof &> /dev/null; then
          PIDS=$(lsof -ti:${{ inputs.port }} 2>/dev/null || true)
          if [ -n "$PIDS" ]; then
            echo "Force killing remaining processes on port ${{ inputs.port }}: $PIDS"
            echo "$PIDS" | xargs -r kill -9 2>/dev/null || true
          fi
        fi

        # Verify port is released
        if curl -s http://localhost:${{ inputs.port }} > /dev/null 2>&1; then
          echo "⚠️ Warning: Port ${{ inputs.port }} is still in use"
        else
          echo "✅ Port ${{ inputs.port }} is released"
        fi
