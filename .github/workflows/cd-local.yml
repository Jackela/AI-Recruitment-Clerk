name: cd-local

on:
  push:
    branches:
      - main

jobs:
  pre-release-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22.22.0'
      - name: Cache npm
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - name: Cache Playwright browsers
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install deps
        run: npm ci
      - name: Pre-release Deploy
        run: pwsh ./tools/deploy/pre-release.deploy.ps1

  post-deploy-smoke:
    needs: pre-release-deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22.22.0'
      - name: Cache npm
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - name: Cache Playwright browsers
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install deps
        run: npm ci
      - name: Build frontend for E2E smoke
        run: npx nx build ai-recruitment-frontend --configuration=production
      - name: Start static server for E2E smoke
        run: |
          npx nx run ai-recruitment-frontend:serve-static --port 4200 > /tmp/server.log 2>&1 &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> "$GITHUB_ENV"
          echo "Waiting for server to be ready..."
          for i in {1..12}; do
            if curl -s -f http://localhost:4200 > /dev/null 2>&1; then
              echo "Server is ready after ${i}s!"
              break
            fi
            echo "Waiting... ($i/12)"
            sleep 5
          done
          if ! curl -s -f http://localhost:4200 > /dev/null 2>&1; then
            echo "Server failed to start. Log output:"
            cat /tmp/server.log
            exit 1
          fi
      - name: Install Playwright browsers
        run: npx playwright install --with-deps || npx playwright install
      - name: Run E2E Smoke
        run: npm run test:e2e
        env:
          CI: true
          E2E_SKIP_WEBSERVER: true
      - name: Stop static server
        if: always()
        run: |
          if [ -n "${SERVER_PID:-}" ]; then
            kill "$SERVER_PID" || true
          fi
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: playwright-report
          path: |
            playwright-report
            e2e/results
          if-no-files-found: ignore
          retention-days: 7
