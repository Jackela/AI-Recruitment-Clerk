name: ci-affected

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-affected-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NX_SKIP_NATIVE_FILE_CACHE: 'true'
  NX_DAEMON: 'false'
  NODE_OPTIONS: '--max-old-space-size=4096'

jobs:
  affected:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Cache Nx
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            .nx/cache
            node_modules/.cache
          key: ${{ runner.os }}-nx-${{ hashFiles('package-lock.json', '**/project.json') }}
          restore-keys: |
            ${{ runner.os }}-nx-
      - name: Cache Jest
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            .jest-cache
          key: ${{ runner.os }}-jest-${{ hashFiles('package-lock.json', '**/jest.config.*') }}
          restore-keys: |
            ${{ runner.os }}-jest-
      - name: Cache Playwright browsers
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - run: npm ci
      - name: Print affected graph
        run: npx nx show projects --affected --base=origin/main --head=HEAD
      - name: Print affected projects
        id: affected_projects
        run: |
          echo "Affected projects:"
          AFFECTED_PROJECTS="$(npx nx show projects --affected --base=origin/main --head=HEAD | tr '\n' ' ')"
          echo "$AFFECTED_PROJECTS"
          echo "projects=$AFFECTED_PROJECTS" >> "$GITHUB_OUTPUT"
          if echo " $AFFECTED_PROJECTS " | grep -qE " (ai-recruitment-frontend|ai-recruitment-frontend-e2e) "; then
            echo "run_e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_e2e=false" >> "$GITHUB_OUTPUT"
          fi
          echo ""
          echo "Affected projects with test target:"
          npx nx print-affected --type=test --select=projects --base=origin/main --head=HEAD || echo "No test target projects affected"
      - name: Lint affected
        timeout-minutes: 10
        run: npx nx affected -t lint --base=origin/main --head=HEAD --parallel=2
      - name: Test affected
        timeout-minutes: 15
        run: npx nx affected -t test --base=origin/main --head=HEAD --parallel=2 --passWithNoTests --exclude=app-gateway,resume-parser-svc,ai-recruitment-frontend,scoring-engine-svc,report-generator-svc,shared-dtos,infrastructure-shared,candidate-scoring-domain,usage-management-domain,resume-processing-domain,report-generation-domain
      - name: Build affected
        timeout-minutes: 15
        run: npx nx affected -t build --base=origin/main --head=HEAD --parallel=2
      - name: Build frontend for affected E2E
        if: steps.affected_projects.outputs.run_e2e == 'true'
        timeout-minutes: 15
        run: npx nx build ai-recruitment-frontend --configuration=production
      - name: Manage server lifecycle
        if: steps.affected_projects.outputs.run_e2e == 'true'
        uses: ./.github/actions/server-lifecycle
        timeout-minutes: 5
        with:
          port: 4200
          build-command: 'echo "Build already done via Build affected"'
          serve-command: 'STATIC_DIR=dist/apps/ai-recruitment-frontend/browser node scripts/proxy-server.cjs'
          health-check-url: 'http://localhost:4200'
          health-check-timeout: '90000'
          verify-build-output: 'dist/apps/ai-recruitment-frontend/browser'
          server-log-path: '/tmp/server.log'
      - name: E2E affected
        if: steps.affected_projects.outputs.run_e2e == 'true'
        timeout-minutes: 18
        # Skip app-gateway-e2e due to complex service dependencies
        # Skip @accessibility tests (pre-existing UI issues)
        run: npx nx affected -t e2e --base=origin/main --head=HEAD --exclude=app-gateway-e2e --configuration=ci --parallel=1 -- --grep-invert @accessibility --grep-invert @visual
        env:
          CI: true
          E2E_SKIP_WEBSERVER: true
