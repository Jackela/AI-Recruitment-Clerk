name: migration-rehearsal

on:
  workflow_dispatch:


jobs:
  rehearsal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '20'
      - run: npm ci
      - name: Convert resume fixtures
        run: node tools/migration/convert-resume-format.mjs
      - name: Compare summary
        run: node tools/migration/compare-summary.mjs
      - name: Consistency metrics
        run: node tools/migration/consistency-metrics.mjs
      - name: Upload migration logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: migration-logs
          path: tools/logs/migration
          if-no-files-found: ignore
