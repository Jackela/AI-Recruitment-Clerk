name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NX_SKIP_NATIVE_FILE_CACHE: 'true'
  NX_DAEMON: 'false'
  HUSKY: '0'

jobs:
  file_size_check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check file sizes
        run: |
          echo "Checking for files over 500 lines..."
          FOUND=0
          while IFS= read -r line; do
            if [ -n "$line" ]; then
              echo "::warning file=$(echo "$line" | awk '{print $2}')::$(echo "$line" | awk '{print $2}') has $(echo "$line" | awk '{print $1}') lines (max 500)"
              FOUND=1
            fi
          done < <(find apps libs -name "*.ts" -not -path "*/node_modules/*" -exec wc -l {} \; 2>/dev/null | awk '$1 > 500 {print $0}')
          if [ "$FOUND" -eq 1 ]; then
            echo ""
            echo "Warning: Some files exceed the 500 line limit. Consider refactoring for better maintainability."
          else
            echo "All files are within the 500 line limit."
          fi

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Cache Nx
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            .nx/cache
            node_modules/.cache
          key: ${{ runner.os }}-nx-${{ hashFiles('package-lock.json', '**/project.json') }}
          restore-keys: |
            ${{ runner.os }}-nx-
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Cache Nx
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            .nx/cache
            node_modules/.cache
          key: ${{ runner.os }}-nx-${{ hashFiles('package-lock.json', '**/project.json') }}
          restore-keys: |
            ${{ runner.os }}-nx-
      - run: npm ci
      - run: npm run typecheck

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Cache Nx
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            .nx/cache
            node_modules/.cache
          key: ${{ runner.os }}-nx-${{ hashFiles('package-lock.json', '**/project.json') }}
          restore-keys: |
            ${{ runner.os }}-nx-
      - run: npm ci
      - run: npm run build

  test_coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Cache Nx
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            .nx/cache
            node_modules/.cache
          key: ${{ runner.os }}-nx-${{ hashFiles('package-lock.json', '**/project.json') }}
          restore-keys: |
            ${{ runner.os }}-nx-
      - name: Cache Jest
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            .jest-cache
          key: ${{ runner.os }}-jest-${{ hashFiles('package-lock.json', '**/jest.config.*') }}
          restore-keys: |
            ${{ runner.os }}-jest-
      - run: npm ci
      - name: Run Unit Tests with timing
        run: |
          echo "::group::Test Execution Timing"
          start_time=$(date +%s)
          # Use Jest directly for proper sharding (Nx doesn't support --shard flag)
          npx jest --config jest.config.mjs --shard=${{ matrix.shard }}/6 --coverage
          end_time=$(date +%s)
          duration=$((end_time - start_time))
          echo "Test shard ${{ matrix.shard }} completed in ${duration} seconds"
          echo "::endgroup::"

          # 如果超过10分钟，发出警告
          if [ $duration -gt 600 ]; then
            echo "::warning::Test shard ${{ matrix.shard }} took ${duration}s (>10min)"
          fi
      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: coverage/
          retention-days: 1

  test_coverage_merge:
    runs-on: ubuntu-latest
    needs: [test_coverage]
    timeout-minutes: 10
    outputs:
      test_duration: ${{ steps.duration.outputs.duration }}
      coverage_lines: ${{ steps.coverage.outputs.lines }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci

      - name: ⏱️ Record Start Time
        run: echo "TEST_START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Download all coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-shard-*
          path: coverage-download/
          merge-multiple: false

      - name: Prepare coverage directory
        run: |
          mkdir -p coverage
          # Copy coverage files from downloaded shards
          for shard_dir in coverage-download/coverage-shard-*/; do
            if [ -d "$shard_dir" ]; then
              shard_name=$(basename "$shard_dir")
              echo "Processing $shard_name..."
              # Find and copy coverage-final.json
              if [ -f "$shard_dir/coverage-final.json" ]; then
                cp "$shard_dir/coverage-final.json" "coverage/coverage-${shard_name}.json"
                echo "  ✓ Copied coverage-final.json"
              elif [ -f "$shard_dir/coverage/coverage-final.json" ]; then
                cp "$shard_dir/coverage/coverage-final.json" "coverage/coverage-${shard_name}.json"
                echo "  ✓ Copied coverage/coverage-final.json"
              else
                echo "  ⚠️ No coverage-final.json found in $shard_name"
                find "$shard_dir" -name "*.json" -type f | head -5
              fi
            fi
          done
          echo ""
          echo "📁 Coverage files prepared:"
          ls -la coverage/

      - name: Merge Coverage Reports
        run: |
          echo "📂 Listing downloaded coverage artifacts..."
          find coverage/ -type f -name "*.json" | head -20
          echo ""
          echo "🔧 Flattening coverage structure..."
          # Find all coverage-final.json files from shards and copy to flat structure
          find coverage/ -name "coverage-final.json" -type f | while read f; do
            shard=$(basename $(dirname "$f"))
            cp "$f" "coverage/coverage-${shard}.json"
            echo "  ✓ Copied $f -> coverage/coverage-${shard}.json"
          done
          echo ""
          echo "📊 Merging coverage reports..."
          npx nyc merge coverage/ coverage/merged-coverage.json
          echo "✅ Coverage merged successfully"
          echo ""
          echo "📝 Generating reports..."
          npx nyc report -t coverage --reporter=lcov --reporter=json-summary
          echo ""
          echo "📁 Final coverage files:"
          ls -la coverage/

      - name: ⏱️ Calculate Test Duration
        id: duration
        run: |
          TEST_END_TIME=$(date +%s)
          DURATION=$((TEST_END_TIME - TEST_START_TIME))
          echo "duration=$DURATION" >> $GITHUB_OUTPUT
          echo "⏱️ Test merge duration: ${DURATION}s"

      - name: 📊 Extract Coverage Stats
        id: coverage
        run: |
          if [ -f "coverage/coverage-summary.json" ]; then
            LINES=$(node -e "console.log(Math.round(JSON.parse(require('fs').readFileSync('coverage/coverage-summary.json', 'utf8')).total.lines.pct))")
            echo "lines=$LINES" >> $GITHUB_OUTPUT
            echo "📊 Line coverage: ${LINES}%"
          else
            echo "lines=0" >> $GITHUB_OUTPUT
          fi

      - name: 📊 Upload Coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: ai-recruitment-clerk
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: 📤 Upload Duration Metrics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-metrics-${{ github.run_id }}
          path: ci-metrics/
          if-no-files-found: ignore
          retention-days: 30

      - name: Enforce thresholds
        run: node tools/ci/verify-quality-gates.mjs

  e2e_smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: '--max-old-space-size=4096'
      CI: true
      NX_NO_CACHED_BUILDS: 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Cache Nx
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            .nx/cache
            node_modules/.cache
          key: ${{ runner.os }}-nx-${{ hashFiles('package-lock.json', '**/project.json') }}
          restore-keys: |
            ${{ runner.os }}-nx-
      - name: Cache Playwright browsers
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - run: npm ci
      - name: Manage server lifecycle
        uses: ./.github/actions/server-lifecycle
        with:
          port: 4200
          build-command: 'NODE_OPTIONS="--max-old-space-size=4096" npx nx build ai-recruitment-frontend --configuration=webkit-test'
          serve-command: 'STATIC_DIR=dist/apps/ai-recruitment-frontend/browser node scripts/proxy-server.cjs'
          health-check-url: 'http://localhost:4200'
          health-check-timeout: '90000'
          verify-build-output: 'dist/apps/ai-recruitment-frontend/browser'
          server-log-path: '/tmp/server.log'
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E Tests (Shard ${{ matrix.shard }}/2)
        working-directory: apps/ai-recruitment-frontend-e2e
        run: npx playwright test --grep-invert @pdf-variety --grep-invert @real-data --grep-invert @accessibility --grep-invert @visual --shard=${{ matrix.shard }}/2 --pass-with-no-tests
        env:
          CI: true
          E2E_SKIP_WEBSERVER: true
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            apps/ai-recruitment-frontend-e2e/playwright-report
            apps/ai-recruitment-frontend-e2e/test-results
          if-no-files-found: ignore
          retention-days: 7

  pii_scan:
    runs-on: ubuntu-latest
    needs: [test_coverage_merge, e2e_smoke]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Cache Nx
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            .nx/cache
            node_modules/.cache
          key: ${{ runner.os }}-nx-${{ hashFiles('package-lock.json', '**/project.json') }}
          restore-keys: |
            ${{ runner.os }}-nx-
      - run: npm ci
      - name: PII Scan
        run: node tools/ci/pii-scan.mjs

  todo_counter:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Count TODO/FIXME comments
        run: |
          echo "========================================"
          echo "TODO/FIXME Comment Counter"
          echo "========================================"
          echo ""

          # Count total TODO/FIXME comments
          TODO_COUNT=$(grep -r "TODO\|FIXME" apps libs --include="*.ts" 2>/dev/null | wc -l || echo "0")
          echo "Total TODO/FIXME comments: $TODO_COUNT"
          echo ""

          # List files with TODOs (limited to 20 for readability)
          echo "Files with TODO/FIXME comments (max 20):"
          echo "----------------------------------------"
          grep -rl "TODO\|FIXME" apps libs --include="*.ts" 2>/dev/null | head -20 || echo "No files found"
          echo ""

          # Show detailed breakdown by type
          echo "Breakdown by type:"
          echo "----------------------------------------"
          TODO_ONLY=$(grep -r "TODO" apps libs --include="*.ts" 2>/dev/null | wc -l || echo "0")
          FIXME_ONLY=$(grep -r "FIXME" apps libs --include="*.ts" 2>/dev/null | wc -l || echo "0")
          echo "  TODO comments: $TODO_ONLY"
          echo "  FIXME comments: $FIXME_ONLY"
          echo ""

          # Show first 10 actual TODO lines as examples
          if [ "$TODO_COUNT" -gt 0 ]; then
            echo "Sample TODO/FIXME entries (first 10):"
            echo "----------------------------------------"
            grep -rn "TODO\|FIXME" apps libs --include="*.ts" 2>/dev/null | head -10
          fi

          echo ""
          echo "========================================"
          echo "This is informational only - build will not fail"
          echo "========================================"
