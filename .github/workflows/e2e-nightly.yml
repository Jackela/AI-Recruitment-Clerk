name: e2e-nightly

on:
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC daily
  workflow_dispatch:

env:
  CI: true

jobs:
  e2e_full:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Cache Nx
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            .nx/cache
            node_modules/.cache
          key: ${{ runner.os }}-nx-${{ hashFiles('package-lock.json', '**/project.json') }}
          restore-keys: |
            ${{ runner.os }}-nx-
      - name: Cache Playwright browsers
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - run: npm ci
      - name: Manage server lifecycle
        uses: ./.github/actions/server-lifecycle
        with:
          port: 4200
          build-command: 'npx nx build ai-recruitment-frontend --configuration=webkit-test'
          serve-command: 'node scripts/proxy-server.cjs'
          health-check-url: 'http://localhost:4200'
          health-check-timeout: '60000'
          server-log-path: '/tmp/server.log'
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run full E2E
        working-directory: apps/ai-recruitment-frontend-e2e
        run: npx playwright test --grep-invert @pdf-variety --grep-invert @real-data --grep-invert @accessibility --grep-invert @visual --pass-with-no-tests
        env:
          E2E_SKIP_WEBSERVER: true
      - name: Check Visual Regression Baselines
        id: visual-baselines
        shell: bash
        run: |
          snapshot_count=$(find apps/ai-recruitment-frontend-e2e/src/visual -name "*.png" -path "*-snapshots*" 2>/dev/null | wc -l)
          echo "snapshot_count=${snapshot_count}" >> "$GITHUB_OUTPUT"
          echo "Found ${snapshot_count} committed visual baseline snapshots"
          if [ "${snapshot_count}" -gt 0 ]; then
            echo "snapshots_exist=true" >> "$GITHUB_OUTPUT"
          else
            echo "snapshots_exist=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Initialize Visual Regression Baselines
        if: steps.visual-baselines.outputs.snapshots_exist != 'true'
        run: npm run test:e2e:visual:update
        env:
          E2E_SKIP_WEBSERVER: true
      - name: Run Visual Regression Tests
        if: steps.visual-baselines.outputs.snapshots_exist == 'true'
        run: npm run test:e2e:visual:ci
        env:
          E2E_SKIP_WEBSERVER: true
      - name: Upload Visual Regression Snapshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-snapshots-diffs
          path: |
            apps/ai-recruitment-frontend-e2e/src/visual/**/*-snapshots/**/*.png
            apps/ai-recruitment-frontend-e2e/src/visual/**/*-diff.png
            apps/ai-recruitment-frontend-e2e/src/visual/**/*-actual.png
            apps/ai-recruitment-frontend-e2e/src/visual/**/*-expected.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Playwright report (if present)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            apps/ai-recruitment-frontend-e2e/playwright-report
            apps/ai-recruitment-frontend-e2e/test-results
          if-no-files-found: ignore
          retention-days: 7
