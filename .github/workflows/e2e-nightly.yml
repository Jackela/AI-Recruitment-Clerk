name: e2e-nightly

on:
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC daily
  workflow_dispatch:

env:
  CI: true

jobs:
  e2e_full:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Cache Nx
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            .nx/cache
            node_modules/.cache
          key: ${{ runner.os }}-nx-${{ hashFiles('package-lock.json', '**/project.json') }}
          restore-keys: |
            ${{ runner.os }}-nx-
      - name: Cache Playwright browsers
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            pw-${{ runner.os }}-
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Build Frontend
        run: npx nx build ai-recruitment-frontend --configuration=production
      - name: Start static server for E2E
        run: |
          npx nx run ai-recruitment-frontend:serve-static --port 4200 > /tmp/server.log 2>&1 &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          echo "Waiting for server to be ready..."
          for i in {1..12}; do
            if curl -s -f http://localhost:4200 > /dev/null 2>&1; then
              echo "Server is ready after ${i}s!"
              break
            fi
            echo "Waiting... ($i/12)"
            sleep 5
          done
          if ! curl -s -f http://localhost:4200 > /dev/null 2>&1; then
            echo "Server failed to start. Log output:"
            cat /tmp/server.log
            exit 1
          fi
      - name: Run full E2E
        run: npm run test:e2e
        env:
          E2E_SKIP_WEBSERVER: true
      - name: Run Visual Regression Tests
        run: npm run test:e2e:visual:ci
        env:
          E2E_SKIP_WEBSERVER: true
      - name: Stop static server
        if: always()
        run: |
          if [ -n "$SERVER_PID" ]; then
            kill $SERVER_PID 2>/dev/null || true
          fi
      - name: Upload Visual Regression Snapshots
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: visual-snapshots-diffs
          path: |
            apps/ai-recruitment-frontend-e2e/src/visual/**/*-diff.png
            apps/ai-recruitment-frontend-e2e/src/visual/**/*-actual.png
            apps/ai-recruitment-frontend-e2e/src/visual/**/*-expected.png
          if-no-files-found: ignore
      - name: Upload Playwright report (if present)
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: playwright-report
          path: |
            apps/ai-recruitment-frontend-e2e/playwright-report
            apps/ai-recruitment-frontend-e2e/test-results
          if-no-files-found: ignore
